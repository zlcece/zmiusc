name: Build five-platform release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'windows-build.log'
          flutter build windows --release --no-pub 2>&1 | Tee-Object -FilePath $logPath
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $diagnosticLines = Get-Content -LiteralPath $logPath |
              Select-String -Pattern 'error|exception|failed|failure|fatal|could not|not found|undefined|no such file|what went wrong' |
              Select-Object -Last 8 -ExpandProperty Line
            if (-not $diagnosticLines) {
              $diagnosticLines = Get-Content -LiteralPath $logPath -Tail 8
            }
            $diagnosticLines | ForEach-Object {
              $line = $_ -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error title=Windows build failed::$line"
            }
            exit $buildExitCode
          }
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $makeNsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makeNsis)) {
            $makeNsis = "$env:ProgramFiles\NSIS\makensis.exe"
          }
          .\windows\installer\build-installer.ps1 `
            -RunnerDirectory "$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release" `
            -MakeNsisPath $makeNsis `
            -OutputFile "$env:GITHUB_WORKSPACE\dist\zmusic-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: zmusic-windows-1.1.2
          path: dist/zmusic-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Android signing
        env:
          ZMUSIC_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZMUSIC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ZMUSIC_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ZMUSIC_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zmusic-release.keystore"
          echo "ZMUSIC_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/zmusic-release.keystore" >> "$GITHUB_ENV"
          echo "ZMUSIC_ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ZMUSIC_ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "ZMUSIC_ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Build Android release
        run: |
          chmod +x android/gradlew
          set +e
          flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$build_exit_code" -ne 0 ]; then
            diagnostic_lines="$(grep -Eai 'error|exception|failed|failure|fatal|could not|not found|undefined|no such file|what went wrong' "$RUNNER_TEMP/android-build.log" | tail -n 8 || true)"
            if [ -z "$diagnostic_lines" ]; then
              diagnostic_lines="$(tail -n 8 "$RUNNER_TEMP/android-build.log")"
            fi
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              printf '::error title=Android build failed::%s\n' "$line"
            done <<< "$diagnostic_lines"
            exit "$build_exit_code"
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/zmusic-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zmusic-android-1.1.2
          path: dist/zmusic-android.apk
          if-no-files-found: error
          retention-days: 14

  android-dilink:
    name: Android DiLink APK
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_zmusicDiLinkCompatibility: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Android signing
        env:
          ZMUSIC_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZMUSIC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ZMUSIC_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ZMUSIC_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zmusic-release.keystore"
          echo "ZMUSIC_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/zmusic-release.keystore" >> "$GITHUB_ENV"
          echo "ZMUSIC_ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ZMUSIC_ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "ZMUSIC_ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Build Android DiLink release
        run: |
          chmod +x android/gradlew
          set +e
          flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/android-dilink-build.log"
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$build_exit_code" -ne 0 ]; then
            diagnostic_lines="$(grep -Eai 'error|exception|failed|failure|fatal|could not|not found|undefined|no such file|what went wrong' "$RUNNER_TEMP/android-dilink-build.log" | tail -n 8 || true)"
            if [ -z "$diagnostic_lines" ]; then
              diagnostic_lines="$(tail -n 8 "$RUNNER_TEMP/android-dilink-build.log")"
            fi
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              printf '::error title=Android DiLink build failed::%s\n' "$line"
            done <<< "$diagnostic_lines"
            exit "$build_exit_code"
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/zmusic-android-dilink.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zmusic-android-dilink-1.1.2
          path: dist/zmusic-android-dilink.apk
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS release
        run: |
          set +e
          flutter build macos --release --no-pub 2>&1 | tee "$RUNNER_TEMP/macos-build.log"
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$build_exit_code" -ne 0 ]; then
            diagnostic_lines="$(grep -Eai 'error|exception|failed|failure|fatal|could not|not found|undefined|no such file|what went wrong' "$RUNNER_TEMP/macos-build.log" | tail -n 8 || true)"
            if [ -z "$diagnostic_lines" ]; then
              diagnostic_lines="$(tail -n 8 "$RUNNER_TEMP/macos-build.log")"
            fi
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              printf '::error title=macOS build failed::%s\n' "$line"
            done <<< "$diagnostic_lines"
            exit "$build_exit_code"
          fi
      - name: Package macOS DMG
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          mkdir -p dist/dmg
          cp -R "$APP_PATH" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Zmusic -srcfolder dist/dmg -format UDZO -ov dist/zmusic-macos.dmg
          rm -rf dist/dmg
      - uses: actions/upload-artifact@v4
        with:
          name: zmusic-macos-1.1.2
          path: dist/zmusic-macos.dmg
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify iOS configuration
        run: |
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' ios/Runner/Info.plist | grep -q audio
          grep -q 'media_kit_libs_ios_audio' pubspec.lock
      - name: Build iOS release without signing
        run: |
          set +e
          flutter build ios --release --no-codesign --no-pub 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$build_exit_code" -ne 0 ]; then
            diagnostic_lines="$(grep -Eai 'error|exception|failed|failure|fatal|could not|not found|undefined|no such file|what went wrong' "$RUNNER_TEMP/ios-build.log" | tail -n 8 || true)"
            if [ -z "$diagnostic_lines" ]; then
              diagnostic_lines="$(tail -n 8 "$RUNNER_TEMP/ios-build.log")"
            fi
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              printf '::error title=iOS build failed::%s\n' "$line"
            done <<< "$diagnostic_lines"
            exit "$build_exit_code"
          fi
      - name: Package unsigned IPA
        run: |
          APP_PATH='build/ios/iphoneos/Runner.app'
          test -d "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = '1.1.2'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = '30'
          mkdir -p dist/ios/Payload
          cp -R "$APP_PATH" dist/ios/Payload/
          rm -rf dist/ios/Payload/Runner.app/_CodeSignature
          rm -f dist/ios/Payload/Runner.app/embedded.mobileprovision
          (cd dist/ios && ditto -c -k --sequesterRsrc --keepParent Payload ../zmusic-ios-unsigned.ipa)
          unzip -t dist/zmusic-ios-unsigned.ipa
          unzip -l dist/zmusic-ios-unsigned.ipa | grep -q 'Payload/Runner.app/Info.plist'
      - uses: actions/upload-artifact@v4
        with:
          name: zmusic-ios-unsigned-1.1.2
          path: dist/zmusic-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - android
      - android-dilink
      - macos
      - ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zmusic-*
          path: release
          merge-multiple: true
      - name: Create release and upload packages
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ github.ref_name }}
          name: Zmusic 1.1.2
          body: Zmusic 1.1.2+30 five-platform release. The iOS IPA is unsigned and requires self-signing. The macOS package is ad-hoc signed and not notarized.
          fail_on_unmatched_files: true
          files: |
            release/zmusic-windows-x64.exe
            release/zmusic-android.apk
            release/zmusic-android-dilink.apk
            release/zmusic-macos.dmg
            release/zmusic-ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ github.token }}
